<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title>Morse code dots and dashes</title><desc>Dots and dashes form the fixed symbol alphabet used by Morse code.</desc><rect width="900" height="330" rx="18" fill="#10151d"/><text x="450" y="52" fill="#f0883e" font-family="sans-serif" font-size="25" text-anchor="middle">SYMBOL TABLES CARRY MEANING</text><g fill="#f3eadb" font-family="ui-monospace,monospace" font-size="30" text-anchor="middle"><text x="210" y="145">A</text><text x="210" y="205" fill="#d8b08d">· —</text><text x="450" y="145">B</text><text x="450" y="205" fill="#d8b08d">— · · ·</text><text x="690" y="145">C</text><text x="690" y="205" fill="#d8b08d">— · — ·</text></g></svg>