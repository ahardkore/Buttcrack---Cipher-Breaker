<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title>Encoded bytes becoming text</title><desc>A byte stream passes through an encoding layer and becomes readable text.</desc><rect width="900" height="330" rx="18" fill="#10151d"/><text x="450" y="48" fill="#f0883e" font-family="sans-serif" font-size="25" text-anchor="middle">ENCODING IS A WRAPPER, NOT A KEY</text><g font-family="ui-monospace,monospace" text-anchor="middle"><rect x="90" y="120" width="220" height="86" rx="12" fill="#2b3542"/><rect x="340" y="120" width="220" height="86" rx="12" fill="#8e4c31"/><rect x="590" y="120" width="220" height="86" rx="12" fill="#2b3542"/><g fill="#f3eadb" font-size="22"><text x="200" y="155">01001000 01101001</text><text x="450" y="155">BASE / CODEC</text><text x="700" y="155">H i</text></g><g fill="#d8b08d" font-size="28"><text x="325" y="172">→</text><text x="575" y="172">→</text></g></g></svg>