<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title>Stacked cipher rotors</title><desc>Three offset rotor discs represent the changing substitution of a wheel cipher.</desc><rect width="900" height="330" rx="18" fill="#10151d"/><text x="450" y="42" fill="#f0883e" font-family="sans-serif" font-size="24" text-anchor="middle">ROTOR ORDER IS THE KEY</text><g fill="none" stroke="#d8b08d" stroke-width="5"><circle cx="310" cy="180" r="95"/><circle cx="450" cy="180" r="95"/><circle cx="590" cy="180" r="95"/></g><g fill="#f3eadb" font-family="ui-monospace,monospace" font-size="18" text-anchor="middle"><text x="310" y="185">A B C</text><text x="450" y="185">D E F</text><text x="590" y="185">G H I</text></g></svg>