<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title>Polygraphic five by five grid</title><desc>A five by five coordinate grid shows how digraph and polygraphic ciphers work on letter pairs.</desc><rect width="900" height="330" rx="18" fill="#10151d"/><text x="450" y="42" fill="#f0883e" font-family="sans-serif" font-size="24" text-anchor="middle">PAIR LETTERS → COORDINATES → PAIRS</text><g transform="translate(315 70)" fill="#f3eadb" font-family="ui-monospace,monospace" font-size="20" text-anchor="middle"><path d="M0 0h270v220H0zM54 0v220M108 0v220M162 0v220M216 0v220M0 44h270M0 88h270M0 132h270M0 176h270" fill="none" stroke="#c87945" stroke-width="2"/><text x="27" y="30">A</text><text x="81" y="30">B</text><text x="135" y="30">C</text><text x="189" y="30">D</text><text x="243" y="30">E</text><text x="27" y="74">F</text><text x="81" y="74">G</text><text x="135" y="74">H</text><text x="189" y="74">I</text><text x="243" y="74">K</text><text x="27" y="118">L</text><text x="81" y="118">M</text><text x="135" y="118">N</text><text x="189" y="118">O</text><text x="243" y="118">P</text><text x="27" y="162">Q</text><text x="81" y="162">R</text><text x="135" y="162">S</text><text x="189" y="162">T</text><text x="243" y="162">U</text><text x="27" y="206">V</text><text x="81" y="206">W</text><text x="135" y="206">X</text><text x="189" y="206">Y</text><text x="243" y="206">Z</text></g></svg>