name: Publish installer to storage

# Manual, and deliberately so.  Every other workflow here builds and verifies;
# this is the one that puts the paid file somewhere a buyer can download it, so
# it takes an explicit click -- or `gh workflow run 'Publish installer to
# storage'` -- and the storage credentials stay in repository secrets.
#
# It publishes a build that has *already* passed the install, exercise and
# uninstall test rather than building a fresh one, because the digest that goes
# on the download page has to be the digest of the file that was tested.  See
# docs/windows-installer.md.
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Installer artifact id to publish. Blank publishes the newest live one.
        required: false
        default: ""
      token:
        description: Object-name token. Blank mints a new unguessable URL; reuse one to republish the same URL.
        required: false
        default: ""
      dry_run:
        description: Print what would be uploaded, without uploading it. Needs no secrets.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: publish (fetch verified build, upload, print the delivery URL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Checked before anything is fetched, so an unconfigured repository says
      # which value is missing instead of failing at the upload with an
      # authentication error from a storage service.
      #
      # ENDPOINT, BUCKET and BASE_URL come from `vars.*`, not `secrets.*`, and
      # that split is load-bearing, not cosmetic: GitHub Actions redacts any
      # log text matching the *value* of a secret, unconditionally, everywhere
      # -- annotations, step summaries, the lot. The whole point of this job is
      # to print the delivery URL so a human can check it before telling
      # buyers about it, and a bucket name and an r2.dev hostname are not
      # secret (the docs said so when these were added as repository secrets
      # anyway, which is exactly how the first dry run printed
      # "***/buttcrack-setup-1.2.1-....exe" instead of a URL anyone could read).
      # Only the two credentials that grant write access to the bucket stay as
      # `secrets.*`.
      - name: Are the storage variables set?
        if: ${{ !inputs.dry_run }}
        env:
          BUTTCRACK_DELIVERY_ENDPOINT: ${{ vars.BUTTCRACK_DELIVERY_ENDPOINT }}
          BUTTCRACK_DELIVERY_BUCKET: ${{ vars.BUTTCRACK_DELIVERY_BUCKET }}
          BUTTCRACK_DELIVERY_BASE_URL: ${{ vars.BUTTCRACK_DELIVERY_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in BUTTCRACK_DELIVERY_ENDPOINT BUTTCRACK_DELIVERY_BUCKET \
                      BUTTCRACK_DELIVERY_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=storage configuration missing::Set$missing in Settings -> Secrets and variables -> Actions -- BUTTCRACK_DELIVERY_ENDPOINT, BUTTCRACK_DELIVERY_BUCKET and BUTTCRACK_DELIVERY_BASE_URL go under the Variables tab (they are not secret and need to be readable in the log); AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY go under Secrets. docs/windows-installer.md lists what each one is."
            exit 1
          fi
          echo "All five storage values are present."

      # GITHUB_TOKEN is set here for a reason that has nothing to do with the
      # repository being public: fetch_installer.py's anonymous calls to the
      # artifacts API share GitHub's unauthenticated rate limit -- 60 requests
      # per hour -- across every hosted runner's IP, not just this job's. An
      # authenticated call (any valid token, no extra scopes needed) gets 5,000
      # an hour on its own account instead. Without this, the first real
      # publish run failed at this exact step with no reason visible anywhere
      # but a 403 from the API, because the token-free design documented in
      # fetch_installer.py's own docstring assumes a human's browser or a
      # sandbox, not a shared CI IP that dozens of unrelated jobs are also
      # calling anonymously in the same hour.
      - name: Which build?
        id: which
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          id="${{ inputs.artifact_id }}"
          if [ -z "$id" ]; then
            id=$(python scripts/fetch_installer.py --list --json | python -c "
          import json, sys
          rows = json.load(sys.stdin)
          if not rows:
              raise SystemExit('no installer artifact is live -- run the Release artifacts workflow first')
          print(rows[0]['id'])
          ")
            echo "Chose the newest live installer artifact: $id"
          fi
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
          python scripts/fetch_installer.py --list | grep -E "version|$id" || true

      # Fetched rather than rebuilt: this is the file whose digest is about to
      # be published, and it is the one CI installed, ran and uninstalled.
      - name: Fetch it, digest checked
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_installer.py --artifact ${{ steps.which.outputs.artifact-id }} --out dist/installer

      - name: Upload to your storage
        env:
          BUTTCRACK_DELIVERY_ENDPOINT: ${{ vars.BUTTCRACK_DELIVERY_ENDPOINT }}
          BUTTCRACK_DELIVERY_BUCKET: ${{ vars.BUTTCRACK_DELIVERY_BUCKET }}
          BUTTCRACK_DELIVERY_BASE_URL: ${{ vars.BUTTCRACK_DELIVERY_BASE_URL }}
          BUTTCRACK_DELIVERY_PREFIX: ${{ vars.BUTTCRACK_DELIVERY_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # R2 accepts any region string and its own tooling writes "auto"; B2
          # and S3 want a real one, so it is a variable with a default rather
          # than a hard-coded value (see publish_installer.upload_env). Not a
          # secret either -- "auto" or "us-west-2" is not sensitive, and the
          # same masking problem applies to anything read from `secrets.*`.
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'auto' }}
        run: |
          set -o pipefail
          python scripts/publish_installer.py dist/installer/*.exe \
            --token "${{ inputs.token }}" \
            --update-site-json ventures/cipher-solver-web/site.json \
            --annotate \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee /tmp/publish.log
          # The exact edit site.json needs, without making it: a runner should
          # not push to main on its own, and the four lines are the whole change.
          git diff -- ventures/cipher-solver-web/site.json >> /tmp/publish.log
          {
            echo "## Installer published"
            echo
            echo '```'
            cat /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
