name: Release artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: release checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # Withdrawing the build below needs actions: write.  Contents stays read.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and build tools
        run: python -m pip install --upgrade pip pyinstaller .

      - name: Unit and offline release checks
        env:
          BUTTCRACK_OFFLINE: "1"
        run: |
          python -m unittest discover -s tests -q
          python scripts/release_checks.py

      - name: Build PyInstaller artifact
        shell: bash
        run: pyinstaller --noconfirm packaging/windows/buttcrack.spec

      - name: Windows startup smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/buttcrack/buttcrack.exe -ArgumentList '--help' -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Package size threshold
        shell: bash
        run: python scripts/ci_release.py size dist 250

      - name: SHA-256 artifacts
        shell: bash
        run: |
          # Same reason as the installer job below: written after hashing, so
          # the file does not list itself.
          sums=$(python scripts/ci_release.py sha256 dist)
          printf '%s\n' "$sums" > dist/SHA256SUMS.json

      # `dist` is the frozen application -- both executables and the runtime
      # they share -- which is the same thing the installer wraps and the same
      # thing the $39.99 buys: a copy that runs without Python.  It is uploaded
      # as a build record, and it is withdrawn again below for the reason the
      # installer job gives in full: a public repository's artefacts are
      # public, so this must not sit here for the ninety days it used to.
      - uses: actions/upload-artifact@v4
        id: upload-build
        with:
          name: buttcrack-${{ matrix.os }}
          path: dist
          retention-days: 1

      - name: Take the build back down
        if: always() && github.event_name != 'workflow_dispatch' && steps.upload-build.outputs.artifact-id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = '${{ steps.upload-build.outputs.artifact-id }}'
          gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning title=build artifact left behind::gh exited $LASTEXITCODE; artifact $id stays up for its one-day retention."
          } else {
            Write-Output "::notice title=build artifact withdrawn::artifact $id was deleted after the checks; dispatch the workflow to keep a copy for a day."
          }

  installer:
    name: installer (build, install, uninstall)
    runs-on: windows-latest
    needs: checks
    timeout-minutes: 45
    # Withdrawing the artifact below needs actions: write.  Contents stays read:
    # nothing in this job has any business pushing.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The wizard is the deliverable, and it is the one artefact that cannot be
      # checked on Linux: silent install, the shortcuts, the per-user PATH entry,
      # and an uninstall that leaves nothing behind are all Windows behaviour.
      # Without this job the installer is written once, reviewed by eye, and
      # shipped -- and the first person to find out whether it works is a
      # customer.
      # The Inno compiler decides the installer's layout, its compression and
      # therefore its size, so its version is part of what the published file is
      # -- but it cannot be pinned for long: jrsoftware keeps only the newest
      # releases online (the /is/6/ index lists about a dozen) and the Chocolatey
      # feed carries one, so the 6.3.3 this used to ask for was already gone by
      # the time it was asked.  Take the current release from the vendor and
      # record which version that turned out to be, so a size that differs from
      # the published one can be explained afterwards.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Chocolatey first: it is already on the runner and it has never
          # failed here, while the vendor download is one redirect away from
          # "the file or directory is corrupted and unreadable" (seen on this
          # runner).  The download is the fallback, not the other way round.
          choco install innosetup --no-progress -y
          $have = Get-ChildItem -Path 'C:\Program Files*\Inno Setup*' -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue
          if (-not $have) {
            try {
              $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
              Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile $setup
              Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
            }
            catch {
              Write-Host "::warning title=Inno Setup download failed::$_"
            }
          }
          $iscc = Get-ChildItem -Path 'C:\Program Files*\Inno Setup*' -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup did not install where it was expected' }
          Write-Host "ISCC: $($iscc.FullName) (version $($iscc.VersionInfo.ProductVersion))"

      # build.ps1 does the freeze, the Caesar smoke test and the installer in
      # one go, so CI runs the same command a maintainer runs by hand.
      - name: Build executables and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Note the version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import buttcrack; print(buttcrack.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "buttcrack $version"

      # One line of inventory, so the commonest confusion -- the script looking
      # for a filename the build did not produce -- is visible without a log.
      - name: Where the artifacts landed
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.sha256' } |
            ForEach-Object { Write-Host ("{0,10:N0}  {1}" -f $_.Length, $_.FullName) }

      # The real test. Installs silently into a temp directory, checks every
      # file, shortcut and registry value the installer claims to create, breaks
      # a cipher with the *installed* executable, runs the 142-check self-test,
      # then uninstalls and checks the machine is as it was.
      #
      # Run as a child process with its output teed to a file, so that a failure
      # can be re-emitted as an annotation below.  The job log archive lives on a
      # host that is not always reachable from a sandbox, and annotations are
      # readable through the API, so a red run still says *what* failed -- the
      # same reason ci.yml's test jobs annotate their failures.
      - name: Install, exercise and remove the product
        id: verify
        shell: pwsh
        run: |
          $transcript = Join-Path $env:RUNNER_TEMP 'installer-test-output.log'
          pwsh -NoProfile -File ./packaging/windows/test-installer.ps1 `
            -Installer "dist/installer/buttcrack-setup-${{ steps.version.outputs.version }}.exe" 2>&1 |
            Tee-Object -FilePath $transcript
          $code = $LASTEXITCODE
          "LASTEXITCODE=$code" | Out-File -FilePath $transcript -Append
          $env:BUTTCRACK_TEST_TRANSCRIPT = $transcript
          if ($code -ne 0) {
            $lines = @(Get-Content $transcript | Where-Object { $_.Trim() } | Select-Object -Last 14)
            $summary = ($lines | ForEach-Object { $_.Trim() }) -join ' || '
            if ($summary.Length -gt 2500) { $summary = $summary.Substring($summary.Length - 2500) }
            Write-Output "::error title=installer verification failed::$summary"
          }
          exit $code

      # Both of these exist so a Windows failure is diagnosable from the API
      # alone: Inno Setup writes its own account of the install to install.log,
      # and the script leaves a breadcrumb naming the assertion that failed.
      - name: Show the installer log on failure
        if: failure()
        shell: pwsh
        run: |
          $breadcrumb = Join-Path $env:TEMP 'buttcrack-installer-failure.txt'
          if (Test-Path $breadcrumb) {
            Write-Output "::error title=installer failure summary::$(Get-Content $breadcrumb -Raw)"
          }
          Get-ChildItem "$env:TEMP\buttcrack-install-test-*" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "--- $($_.FullName) ---"
            Get-ChildItem $_.FullName -Filter '*.log' -Recurse | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName -Tail 200
            }
          }
          # Inno's own complaint is the single most useful line, so lift it into
          # an annotation where it can actually be read.
          $installLog = Get-ChildItem "$env:TEMP\buttcrack-install-test-*" -Recurse -Filter 'install.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installLog) {
            $evidence = @(Get-Content $installLog.FullName | Select-String -Pattern 'Error|error|failed|Failed|Exception' | Select-Object -First 6)
            if ($evidence) {
              $text = ($evidence | ForEach-Object { $_.Line.Trim() }) -join ' || '
              if ($text.Length -gt 2000) { $text = $text.Substring($text.Length - 2000) }
              Write-Output "::error title=Inno Setup reported::$text"
            }
          }

      - name: SHA-256 the installer
        shell: bash
        run: |
          cd dist/installer
          # Hashed into a variable, then written: a plain redirect creates
          # INSTALLER-SHA256.json before Python walks the directory, so the file
          # ends up listing *itself* -- at zero bytes, since it is still empty --
          # and the digest of an empty file inside the digest file is exactly
          # what makes somebody verifying a download distrust the whole thing.
          sums=$(python ../../scripts/ci_release.py sha256 .)
          printf '%s\n' "$sums" > INSTALLER-SHA256.json
          cat INSTALLER-SHA256.json
          # The three numbers the download page needs -- filename, size, digest
          # -- as a notice.  Publishing the digest beside the download (D3) is
          # part of shipping, and a notice is readable from the Checks tab and
          # from the API alike, so nobody has to open a log archive to fill in
          # `windows_app.sha256` and `windows_app.size` in site.json.
          python - <<'PY'
          import json
          from pathlib import Path
          for name, digest in json.loads(Path("INSTALLER-SHA256.json").read_text()).items():
              path = Path(name)
              if path.suffix != ".exe":
                  continue
              print(f"::notice title=installer digest::{path.name} | {path.stat().st_size} bytes | sha256 {digest}")
          PY

      # Kept as a workflow artefact rather than attached to a release or
      # committed: this is the paid download, and both of those places are
      # public.  See docs/windows-installer.md.
      #
      # A public repository's artefacts are public too.  "Kept as an artefact"
      # is not "kept private": the API lists them and hands out a signed
      # download URL to anyone who asks, with no account involved, so thirty
      # days of a $39.99 build refreshed by every push is a giveaway filed
      # under build logs.  The copy here exists to be checked and downloaded by
      # hand, so it lives for a day, and an ordinary run gives it back below
      # rather than leaving it on the shelf.
      - uses: actions/upload-artifact@v4
        id: upload-installer
        with:
          name: buttcrack-installer-${{ steps.version.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/INSTALLER-SHA256.json
          retention-days: 1

      # The counterpart to the note above.  A run triggered by a push or a
      # pull request is verifying a commit, not publishing a product, so its
      # copy does not outlive the checks that read it; a deliberate
      # `gh workflow run 'Release artifacts'` keeps its own for the day above,
      # which is what the release instructions download.
      #
      # `if: always()` because an artifact uploaded before a later failure is
      # exactly the one with no reason to stay.  A failure to delete is a
      # warning and never a red build: a pull request from a fork gets a
      # read-only token, and the tidy-up is not worth failing the job over.
      - name: Take the installer back down
        if: always() && github.event_name != 'workflow_dispatch' && steps.upload-installer.outputs.artifact-id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = '${{ steps.upload-installer.outputs.artifact-id }}'
          gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning title=installer artifact left behind::gh exited $LASTEXITCODE; artifact $id stays up for its one-day retention."
          } else {
            Write-Output "::notice title=installer artifact withdrawn::artifact $id was deleted after the checks; dispatch the workflow to keep a copy for a day."
          }

  clean-install:
    name: clean install
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install . --no-deps
      - run: python -c "import buttcrack; from buttcrack.project import Project; print('clean install OK')"
