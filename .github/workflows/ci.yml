name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:00 UTC every Monday: the slow searches and the sample puzzles, which
    # are too expensive to run on every push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `ruff check` is the gate (config lives in pyproject.toml); `ruff
      # format` is deliberately not enforced because the tree predates it.
      # Pinned to a minor series so a new ruff release cannot turn the build
      # red overnight.
      - name: Install ruff
        run: python -m pip install "ruff~=0.16.0"

      - name: Lint
        run: ruff check .

  repository-integrity:
    name: repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The installable package tests do not traverse the research archive or
      # Markdown source.  Keep those published files parseable and navigable,
      # then verify the canonical PK1–PK10 records independently.
      - name: Check tracked source syntax and local documentation links
        run: python scripts/audit_repository.py

      # These are standalone historical/research programs rather than one
      # library target, so validate each translation unit independently.
      - name: Parse Kryptos C and shell research tools
        run: |
          find kryptos -maxdepth 1 -type f -name '*.c' -print0 | sort -z | xargs -0 -r -n1 gcc -fsyntax-only
          bash -n kryptos/push_to_github.sh kryptos/run_pk9_resumable.sh kryptos/relaunch_pk9_sweeps.sh

      - name: Verify Paradigm Kryptos canonical records
        run: |
          python kryptos/audit_all_deliverables_crosscheck.py
          python kryptos/test_full_suite_reproducibility.py

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A backstop, not a budget: the suite takes about three minutes.  Without a
    # ceiling, a search that never returns leaves the job -- and the pull request
    # -- waiting for the six-hour default, which reads as "still running" rather
    # than "broken".
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the package has zero runtime dependencies and the
      # language model ships in the repository, so the suite runs from a checkout.
      #
      # Failures are re-emitted as workflow annotations: the log archive lives on
      # a host that is not always reachable from a sandbox, and annotations are
      # readable through the API, so a red run still says *which* test failed.
      - name: Unit tests
        env:
          BUTTCRACK_STRICT: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee unit.log || {
            grep -E "^(FAIL|ERROR):" unit.log | sed 's/^/::error title=unit test failure::/'
            # The cause is at the *end* of each traceback, so dump the tail of the
            # failure block rather than its head.
            sed -n '/^====/,$p' unit.log | tail -n 90 | sed 's/^/::notice::/'
            exit 1
          }

      - name: Doctests
        run: python scripts/run_doctests.py

      # The self-test is where a search that never returns gets stuck, so it
      # runs under a clock and keeps its log: `timeout` turns a hang into a
      # failure, and the tail -- which prints each check as it starts -- names
      # the check that hung.  `-u` keeps that tail current rather than sitting
      # in a block buffer while the process is stuck.
      - name: Self-test (quick)
        run: |
          set -o pipefail
          timeout -k 15 900 python -u -m buttcrack selftest --quick 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=self-test (quick) failed with exit $code::$(tail -n 6 selftest.log | tr '\n' ' ')"
            tail -n 30 selftest.log | sed 's/^/::notice::/'
            exit "$code"
          fi

      - name: CLI smoke test
        run: |
          # The count is computed, not hardcoded: adding a cipher should not
          # mean editing the CI file, but a cipher that fails to register should
          # still fail the build.
          COUNT=$(python -c "import buttcrack; print(len(buttcrack.CIPHERS))")
          python -m buttcrack ciphers | grep -q "$COUNT ciphers"
          python -m buttcrack "Wkh txlfn eurzq ira mxpsv ryhu wkh odcb grj" --json \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['solved'], r; assert r['best']['cipher'] in ('caesar','rot13'), r; print('crack ok:', r['best']['key'])"
          python -m buttcrack encrypt vigenere --key LEMON "meet me at noon" | grep -qi "xiqh"
          python -m buttcrack identify "Wkh txlfn eurzq ira" | grep -qi caesar

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install the wheel somewhere else
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import buttcrack; print('version', buttcrack.__version__); print('ciphers', len(buttcrack.CIPHERS))"
          # The data files and the static web UI must be inside the wheel, or an
          # installed buttcrack has no language model and no interface.
          python -c "
          from importlib import resources
          import buttcrack
          data = resources.files('buttcrack') / 'data'
          static = resources.files('buttcrack') / 'static'
          assert (data / 'english_quadgrams.txt.gz').is_file(), 'language model missing from the wheel'
          assert (static / 'index.html').is_file(), 'web UI missing from the wheel'
          print('package data ok')
          "
          COUNT=$(python -c "import buttcrack; print(len(buttcrack.CIPHERS))")
          buttcrack ciphers | grep -q "$COUNT ciphers"
          buttcrack "Zdvkph dw gdzq" --json | python -c "import json,sys; assert json.load(sys.stdin)['solved']"

  slow:
    name: slow searches and sample puzzles
    runs-on: ubuntu-latest
    # Generous, because this job is supposed to be slow -- but bounded, because
    # an unbounded one is indistinguishable from a hung one.
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests including the expensive searches
        env:
          BUTTCRACK_STRICT: "1"
          BUTTCRACK_SLOW: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . 2>&1 | tee unit.log || {
            grep -E "^(FAIL|ERROR):" unit.log | sed 's/^/::error title=unit test failure::/'
            sed -n '/^====/,$p' unit.log | tail -n 90 | sed 's/^/::notice::/'
            exit 1
          }

      - name: Self-test (full)
        run: |
          set -o pipefail
          timeout -k 15 3600 python -u -m buttcrack selftest --slow 2>&1 | tee selftest-slow.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=self-test (slow) failed with exit $code::$(tail -n 6 selftest-slow.log | tr '\n' ' ')"
            tail -n 30 selftest-slow.log | sed 's/^/::notice::/'
            exit "$code"
          fi

      - name: Sample puzzles
        run: python examples/generate.py --check

  site:
    name: public site (build and audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deploy-site.yml only runs on main, so without this a pull request could
      # turn the published site red and nobody would know until after the merge.
      # Same three steps the deploy performs, minus the upload.
      - name: Regenerate the pages
        run: |
          python3 ventures/cipher-solver-web/build_model.py
          python3 ventures/cipher-solver-web/build_pages.py

      # The generated HTML is committed, so a change to build_pages.py that was
      # not followed by a rebuild would publish stale pages. Catch it here.
      - name: Generated pages are up to date with their generator
        run: |
          if ! git diff --quiet -- ventures/cipher-solver-web; then
            echo "::error title=stale generated pages::build_pages.py output differs from what is committed. Run it and commit the result."
            git diff --stat -- ventures/cipher-solver-web
            exit 1
          fi

      - name: Assemble the combined site
        run: python3 scripts/build_site.py --out _site

      - name: Audit the assembled site
        run: python3 scripts/audit_site.py _site --strict

      - name: Verify solver accuracy
        run: node ventures/cipher-solver-web/test.js

  web:
    name: web interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Serve and exercise the API
        run: |
          python -m buttcrack serve --host 127.0.0.1 --port 8080 --no-browser &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health | python -c "import json,sys,buttcrack; h=json.load(sys.stdin); assert h['ciphers'] == len(buttcrack.CIPHERS), h; print('health ok', h['version'])"
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>"
          curl -fsS http://127.0.0.1:8080/api/ciphers | python -c "import json,sys,buttcrack; assert len(json.load(sys.stdin)) == len(buttcrack.CIPHERS)"
          curl -fsS -X POST http://127.0.0.1:8080/api/identify \
               -H 'content-type: application/json' \
               -d '{"text":"Wkh txlfn eurzq ira mxpsv ryhu wkh odcb grj"}' \
            | python -c "import json,sys; r=json.load(sys.stdin); assert any(h['cipher']=='caesar' for h in r['hypotheses']), r"
          curl -fsS -X POST http://127.0.0.1:8080/api/transform \
               -H 'content-type: application/json' \
               -d '{"cipher":"vigenere","key":"LEMON","text":"Meet me at noon.","operation":"encrypt"}' \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['output'] == 'Xiqh zp ef bbzr.', r"
          # Cracking is asynchronous: POST /api/crack returns {"job": id} and the
          # browser polls GET /api/job/<id> until done.  The same flow, in shell.
          crack_and_wait() {
            job_id=$(curl -fsS -X POST http://127.0.0.1:8080/api/crack \
                 -H 'content-type: application/json' \
                 -d "$1" | python -c "import json,sys; print(json.load(sys.stdin)['job'])")
            for i in $(seq 1 90); do
              curl -fsS "http://127.0.0.1:8080/api/job/$job_id" > "/tmp/job-$$.json"
              python -c "import json; raise SystemExit(0 if json.load(open('/tmp/job-$$.json'))['done'] else 1)" && break
              sleep 1
            done
            cat "/tmp/job-$$.json"
          }
          # The language option must reach the solver: a Caesar-shifted French
          # sample has to come back solved and judged as French.
          crack_and_wait '{"text":"WPNSTQQCPXPYEPDEFYACZNPOPOPNCJAEZRCLASTPALCWPBFPWZYDZFSLTEPCPYOCPWLNZXACPSPYDTZYOFYOZNFXPYETXAZDDTMWPLEZFEPAPCDZYYPBFTYPOTDAZDPALDOPWLNWPOPNSTQQCPXPYEMTPYBFPWPNSTQQCPXPYEAFTDDPCPYOCPDPNCPEWPDPYDOFYOZNFXPYEOFYXPDDLRPFYPIAWTNLETZYYPDENZXACPSPYDTMWPBFPALCWPDOPDETYLELTCPDBFTAZDDPOPYEWLNWP","budget":10,"workers":1,"language":"french"}' \
            | python -c "
          import json,sys
          job = json.load(sys.stdin)
          assert job.get('done'), job
          assert not job.get('error'), job
          report = job.get('report') or {}
          assert report.get('solved'), report
          assert report.get('language') == 'french', report
          print('language option ok')
          "
          # Auto-detect has to pick French for the same text without being told.
          crack_and_wait '{"text":"WPNSTQQCPXPYEPDEFYACZNPOPOPNCJAEZRCLASTPALCWPBFPWZYDZFSLTEPCPYOCPWLNZXACPSPYDTZYOFYOZNFXPYETXAZDDTMWPLEZFEPAPCDZYYPBFTYPOTDAZDPALDOPWLNWPOPNSTQQCPXPYEMTPYBFPWPNSTQQCPXPYEAFTDDPCPYOCPDPNCPEWPDPYDOFYOZNFXPYEOFYXPDDLRPFYPIAWTNLETZYYPDENZXACPSPYDTMWPBFPALCWPDOPDETYLELTCPDBFTAZDDPOPYEWLNWP","budget":10,"workers":1,"language":"auto"}' \
            | python -c "
          import json,sys
          job = json.load(sys.stdin)
          assert job.get('done'), job
          assert not job.get('error'), job
          report = job.get('report') or {}
          assert report.get('solved') and report.get('language') == 'french', report
          print('auto language ok')
          "
          # Traversal and unknown routes must be refused, not served.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/../cli.py')" != "200"
          kill $SERVER

  # The web interface is what the desktop application actually shows, and
  # ``tests/browser/app.spec.js`` was the only file in the tree that could run
  # it the way a browser does -- for years, in the sense that nobody ran it.
  # Everything it needs is a browser and the package: no build step, no
  # bundler, which is the point of the front end.
  browser:
    name: browser interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the package, the test runner and a browser
        run: |
          python -m pip install --upgrade pip .
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The html report is uploaded below; the annotations are what make a red
      # run readable from the API alone, which is how this repository reads CI.
      #
      # No `set -o pipefail` here on purpose: the runner runs this script under
      # `bash -e`, where pipefail turns the deliberately-tolerant pipeline below
      # into an immediate exit -- which is exactly how the first version of this
      # step failed without saying a word about which test broke.
      - name: Run the browser tests
        run: |
          npx playwright test --reporter=list 2>&1 | tee browser-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=browser interface failed (exit $code)::$(grep -E '^ *[0-9]+\)|Error:|Timeout|Received|Expected' browser-tests.log | tail -n 12 | tr '\n' ' ')"
            tail -n 80 browser-tests.log | sed 's/^/::notice::/'
            exit "$code"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: playwright-report
          if-no-files-found: ignore
