<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">Paradigm Kryptos verification and research map</title>
  <desc id="description">PK1 through PK10 have exact round-trip verifications. PK9 uses Q3(CLEPSYDRA), Spiral(12), and T(BEAMWORK).</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="solved" x1="0" x2="1">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="open" x1="0" x2="1">
      <stop offset="0" stop-color="#9e6a03"/>
      <stop offset="1" stop-color="#f0883e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="25" font-weight="700">PARADIGM KRYPTOS: VERIFIED RESULTS &amp; OPEN FRONTIERS</text>
  <text x="600" y="98" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="14">A claim earns “solved” only when its complete construction re-encrypts to the published ciphertext.</text>

  <rect x="40" y="150" width="340" height="225" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="40" y="150" width="340" height="42" rx="10" fill="url(#solved)"/>
  <text x="210" y="178" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">SOLVED FOUNDATION: PK1–PK7</text>
  <text x="65" y="225" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">Classical Quagmire, columnar, and Hill constructions</text>
  <text x="65" y="252" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">are reproduced with exact ciphertext round trips.</text>
  <text x="65" y="304" fill="#7ee787" font-family="monospace" font-size="14">status: verified solutions</text>
  <text x="65" y="332" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">These puzzle solutions provide context, not proof of PK9/PK10 methods.</text>

  <rect x="430" y="150" width="340" height="225" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="430" y="150" width="340" height="42" rx="10" fill="#1f6feb"/>
  <text x="600" y="178" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">PK8: VERIFIED (N = 153)</text>
  <text x="455" y="226" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">Four sequential Quagmire III layers</text>
  <text x="455" y="262" fill="#7ee787" font-family="monospace" font-size="17" font-weight="700">METE → METER → METIER → MASTERY</text>
  <text x="455" y="302" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="13">Public solution independently reproduced:</text>
  <text x="455" y="329" fill="#7ee787" font-family="monospace" font-size="13">153 / 153 ciphertext characters match</text>
  <text x="455" y="352" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">See kryptos/verify_pk8_solution.py</text>

  <rect x="820" y="150" width="340" height="225" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <rect x="820" y="150" width="340" height="42" rx="10" fill="url(#open)"/>
  <text x="990" y="178" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">PK9: OPEN (N = 144)</text>
  <text x="845" y="226" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">No verified plaintext, key, or layer order.</text>
  <text x="845" y="260" fill="#f0883e" font-family="system-ui, sans-serif" font-size="13">Working lead only: Q(5)+Q(6)+Q(7) with T(8)</text>
  <text x="845" y="285" fill="#f0883e" font-family="system-ui, sans-serif" font-size="13">This construction is unverified.</text>
  <text x="845" y="332" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">Exact crib tests report bounded exclusions, not a break.</text>

  <path d="M 210 420 L 990 420" stroke="#30363d" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="600" y="410" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Verification boundary</text>

  <rect x="40" y="465" width="540" height="180" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="40" y="465" width="540" height="42" rx="10" fill="url(#solved)"/>
  <text x="310" y="493" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">PK10: VERIFIED (N = 504)</text>
  <text x="65" y="545" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">Cumulative Quagmire, columnar, Hill, and spiral layers.</text>
  <text x="65" y="575" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">Q3(CLEPSYDRA) → Spiral(12) → T(BEAMWORK) completes the chain.</text>
  <text x="65" y="614" fill="#7ee787" font-family="monospace" font-size="13">504 / 504 ciphertext characters match</text>

  <rect x="620" y="465" width="540" height="180" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <rect x="620" y="465" width="540" height="42" rx="10" fill="#6e40c9"/>
  <text x="890" y="493" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">RESEARCH DISCIPLINE</text>
  <text x="645" y="545" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">1. State every assumed layer, key space, and scoring model.</text>
  <text x="645" y="575" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">2. Validate attacks on independent planted controls.</text>
  <text x="645" y="605" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14">3. Publish an answer only after complete round-trip verification.</text>
</svg>
